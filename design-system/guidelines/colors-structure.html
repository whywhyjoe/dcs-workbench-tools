<!-- @dsCard group="Colors" viewport="700x190" subtitle="Editor ground, hairlines, and the hosted surround" name="Structure" -->
<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>body{background:var(--bg-0);padding:16px;font:var(--t-body);color:var(--fg)}
.g{display:grid;gap:10px}.r{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sw{flex:1 1 0;min-width:0;background:var(--bg-1);border:1px solid var(--border);border-radius:var(--radius-m);overflow:hidden}
.sw .chip{height:34px}.sw .m{padding:7px 9px}
.sw .n{font:500 11px/1.3 var(--mono);color:var(--fg-row);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sw .h{font:400 10px/1.3 var(--mono);color:var(--fg-faint);margin-top:2px}
.sw .u{font:400 10.5px/1.4 var(--sans);color:var(--fg-dim);margin-top:5px;text-wrap:pretty}
.lbl{font:var(--t-panel);letter-spacing:var(--ls-panel);text-transform:uppercase;color:var(--fg-faint)}
</style></head><body><div class="r">
<div class="sw"><div class="chip" style="background:#17191f;display:grid;place-items:center;color:#17191f;font:500 13px/1 var(--mono)"></div><div class="m"><div class="n">--bg-editor</div><div class="h">#17191f</div><div class="u">Code ground — matches the Monaco theme</div></div></div>
<div class="sw"><div class="chip" style="background:#2a2e38;display:grid;place-items:center;color:#2a2e38;font:500 13px/1 var(--mono)"></div><div class="m"><div class="n">--border</div><div class="h">#2a2e38</div><div class="u">Structural hairlines. Opaque by design</div></div></div>
<div class="sw"><div class="chip" style="background:#3a4150;display:grid;place-items:center;color:#3a4150;font:500 13px/1 var(--mono)"></div><div class="m"><div class="n">--border-strong</div><div class="h">#3a4150</div><div class="u">Edges of interactive things</div></div></div>
<div class="sw"><div class="chip" style="background:#101216;display:grid;place-items:center;color:#101216;font:500 13px/1 var(--mono)"></div><div class="m"><div class="n">--surround</div><div class="h">#101216</div><div class="u">Hosted SharePoint surround, behind the app</div></div></div>
</div></body></html>
