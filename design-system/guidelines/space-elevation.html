<!-- @dsCard group="Spacing" viewport="700x150" subtitle="One shadow, and it means "this floats above the app"" name="Elevation" -->
<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>body{background:var(--bg-0);padding:16px;font:var(--t-body);color:var(--fg)}
.g{display:grid;gap:10px}.r{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.spec{flex:none;width:112px;font:500 10.5px/1.4 var(--mono);color:var(--fg-faint)}
.note{font:10.5px/1.5 var(--sans);color:var(--fg-faint);text-wrap:pretty}
.lbl{font:var(--t-panel);letter-spacing:var(--ls-panel);text-transform:uppercase;color:var(--fg-faint)}
</style></head><body><div class="r" style="gap:24px">
<div style="width:120px;height:66px;background:var(--bg-2);border:1px solid var(--border-strong);border-radius:var(--radius-l);box-shadow:var(--shadow-pop)"></div>
<code style="font:10.5px/1.7 var(--mono);color:var(--fg-faint)">--shadow-pop:<br>0 10px 28px -10px #000d</code>
<div class="note" style="flex:1 1 200px;min-width:180px">Menus, dialogs and toasts carry it. <strong style="color:var(--fg-row);font-weight:600">Panels never do</strong> — they are separated by hairlines and surface steps. Using a shadow to separate two adjacent panels is the mistake this rule exists to prevent.</div>
</div></body></html>
