<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>body{background:var(--bg-0);padding:16px;font:var(--t-body);color:var(--fg)}
.g{display:grid;gap:10px}.r{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.note{font:10.5px/1.5 var(--sans);color:var(--fg-faint);text-wrap:pretty}
.lbl{font:var(--t-panel);letter-spacing:var(--ls-panel);text-transform:uppercase;color:var(--fg-faint)}
.cl{font:500 10.5px/1 var(--mono);color:var(--fg-faint)}
.col{display:flex;flex-direction:column;gap:8px}
</style></head><body><div class="g"><div class="r" style="gap:26px">
<span class="dcs-mark-2x2" style="grid-template-columns:repeat(2,14px);grid-auto-rows:14px;gap:4px"><i></i><i></i><i></i><i></i></span>
<span class="dcs-mark-2x2"><i></i><i></i><i></i><i></i></span>
<span style="font:10.5px/1.5 var(--mono);color:var(--fg-faint)">14px demo<br>6px shipping</span>
<span style="width:1px;height:36px;background:var(--border)"></span>
<span class="dcs-wordmark">DCS<b>WORKBENCH</b></span>
<span class="dcs-wordmark" style="font-size:13px">SP<b>WORKBENCH</b></span>
</div>
<div class="note">Four cells, one accent hue, four brightness steps: 100 / 62 / 38 / 20%. <strong style="color:var(--fg-row);font-weight:600">No tile, no outline, no background</strong> — it sits directly on the tool header. The wordmark beside it is mono, split weight: quiet prefix, accent suffix.</div></div></body></html>
