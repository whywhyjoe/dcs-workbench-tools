<!-- @dsCard group="Colors" viewport="700x190" subtitle="Status only. A signal colour that is not reporting status is a bug" name="Signals" -->
<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>body{background:var(--bg-0);padding:16px;font:var(--t-body);color:var(--fg)}
.g{display:grid;gap:10px}.r{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sw{flex:1 1 0;min-width:0;background:var(--bg-1);border:1px solid var(--border);border-radius:var(--radius-m);overflow:hidden}
.sw .chip{height:34px}.sw .m{padding:7px 9px}
.sw .n{font:500 11px/1.3 var(--mono);color:var(--fg-row);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sw .h{font:400 10px/1.3 var(--mono);color:var(--fg-faint);margin-top:2px}
.sw .u{font:400 10.5px/1.4 var(--sans);color:var(--fg-dim);margin-top:5px;text-wrap:pretty}
.lbl{font:var(--t-panel);letter-spacing:var(--ls-panel);text-transform:uppercase;color:var(--fg-faint)}
</style></head><body><div class="g"><div class="r">
<div class="sw"><div class="chip" style="background:#57d18a;display:grid;place-items:center;color:#57d18a;font:500 13px/1 var(--mono)"></div><div class="m"><div class="n">--ok</div><div class="h">#57d18a</div><div class="u">Live, saved, succeeded</div></div></div>
<div class="sw"><div class="chip" style="background:#e8b660;display:grid;place-items:center;color:#e8b660;font:500 13px/1 var(--mono)"></div><div class="m"><div class="n">--warn</div><div class="h">#e8b660</div><div class="u">Unsaved, mock context, truncated results</div></div></div>
<div class="sw"><div class="chip" style="background:#ff6b62;display:grid;place-items:center;color:#ff6b62;font:500 13px/1 var(--mono)"></div><div class="m"><div class="n">--error</div><div class="h">#ff6b62</div><div class="u">Error rails, count pills</div></div></div>
<div class="sw"><div class="chip" style="background:#67a7f7;display:grid;place-items:center;color:#67a7f7;font:500 13px/1 var(--mono)"></div><div class="m"><div class="n">--info</div><div class="h">#67a7f7</div><div class="u">Inspector values, HTTP methods, library nodes</div></div></div>
</div></div></body></html>
