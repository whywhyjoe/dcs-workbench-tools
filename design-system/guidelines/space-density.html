<!-- @dsCard group="Spacing" viewport="700x180" subtitle="Pick by the container, not by taste — never mix two tiers in one row" name="Density tiers" -->
<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>body{background:var(--bg-0);padding:16px;font:var(--t-body);color:var(--fg)}
.g{display:grid;gap:10px}.r{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.spec{flex:none;width:112px;font:500 10.5px/1.4 var(--mono);color:var(--fg-faint)}
.note{font:10.5px/1.5 var(--sans);color:var(--fg-faint);text-wrap:pretty}
.lbl{font:var(--t-panel);letter-spacing:var(--ls-panel);text-transform:uppercase;color:var(--fg-faint)}
</style></head><body><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px">
<div class="g" style="gap:9px"><div class="r" style="gap:8px"><span style="font:700 12px/1 var(--mono);color:var(--accent)">lg</span><span style="font:500 11px/1 var(--mono);color:var(--fg-faint)">28px</span></div>
<div class="r" style="gap:6px"><button class="dcs-btn" style="height:28px;padding:0 13px;font-size:12.5px">Run</button><button class="dcs-btn dcs-btn-icon" style="width:28px;height:28px" title="Refresh"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13.2 8A5.2 5.2 0 1 1 11 3.8"/><path d="M13.2 2.6v3.2H10"/></svg></button></div>
<div class="note">Topbar and tool header — the one row a user hits without looking.</div></div><div class="g" style="gap:9px"><div class="r" style="gap:8px"><span style="font:700 12px/1 var(--mono);color:var(--accent)">md</span><span style="font:500 11px/1 var(--mono);color:var(--fg-faint)">26px</span></div>
<div class="r" style="gap:6px"><button class="dcs-btn" style="height:26px;padding:0 12px;font-size:12px">Run</button><button class="dcs-btn dcs-btn-icon" style="width:26px;height:26px" title="Refresh"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13.2 8A5.2 5.2 0 1 1 11 3.8"/><path d="M13.2 2.6v3.2H10"/></svg></button></div>
<div class="note">The default. View toolbars, dialogs, control panels, forms.</div></div><div class="g" style="gap:9px"><div class="r" style="gap:8px"><span style="font:700 12px/1 var(--mono);color:var(--accent)">sm</span><span style="font:500 11px/1 var(--mono);color:var(--fg-faint)">22px</span></div>
<div class="r" style="gap:6px"><button class="dcs-btn" style="height:22px;padding:0 8px;font-size:11px">Run</button><button class="dcs-btn dcs-btn-icon" style="width:22px;height:22px" title="Refresh"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13.2 8A5.2 5.2 0 1 1 11 3.8"/><path d="M13.2 2.6v3.2H10"/></svg></button></div>
<div class="note">Panel heads and inline toolbars, beside a title.</div></div><div class="g" style="gap:9px"><div class="r" style="gap:8px"><span style="font:700 12px/1 var(--mono);color:var(--accent)">xs</span><span style="font:500 11px/1 var(--mono);color:var(--fg-faint)">20px</span></div>
<div class="r" style="gap:6px"><button class="dcs-btn" style="height:20px;padding:0 6px;font-size:10.5px">Run</button><button class="dcs-btn dcs-btn-icon" style="width:20px;height:20px" title="Refresh"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13.2 8A5.2 5.2 0 1 1 11 3.8"/><path d="M13.2 2.6v3.2H10"/></svg></button></div>
<div class="note">Escape hatch. Only inside a tight strip, grouped, glyph-only.</div></div>
</div></body></html>
