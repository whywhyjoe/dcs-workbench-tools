<!-- @dsCard group="Colors" viewport="700x190" subtitle="One hue, six jobs — the solid fill appears once per screen" name="Accent" -->
<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>body{background:var(--bg-0);padding:16px;font:var(--t-body);color:var(--fg)}
.g{display:grid;gap:10px}.r{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sw{flex:1 1 0;min-width:0;background:var(--bg-1);border:1px solid var(--border);border-radius:var(--radius-m);overflow:hidden}
.sw .chip{height:34px}.sw .m{padding:7px 9px}
.sw .n{font:500 11px/1.3 var(--mono);color:var(--fg-row);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sw .h{font:400 10px/1.3 var(--mono);color:var(--fg-faint);margin-top:2px}
.sw .u{font:400 10.5px/1.4 var(--sans);color:var(--fg-dim);margin-top:5px;text-wrap:pretty}
.lbl{font:var(--t-panel);letter-spacing:var(--ls-panel);text-transform:uppercase;color:var(--fg-faint)}
</style></head><body><div class="g"><div class="r">
<div class="sw"><div class="chip" style="background:#3fd8b4;display:grid;place-items:center;color:#3fd8b4;font:500 13px/1 var(--mono)"></div><div class="m"><div class="n">--accent</div><div class="h">#3fd8b4</div><div class="u">Rails, active glyphs, the one solid fill</div></div></div>
<div class="sw"><div class="chip" style="background:#5ee3c4;display:grid;place-items:center;color:#5ee3c4;font:500 13px/1 var(--mono)"></div><div class="m"><div class="n">--accent-hi</div><div class="h">#5ee3c4</div><div class="u">Hover on the solid fill</div></div></div>
<div class="sw"><div class="chip" style="background:#04241e;display:grid;place-items:center;color:#04241e;font:500 13px/1 var(--mono)"></div><div class="m"><div class="n">--accent-ink</div><div class="h">#04241e</div><div class="u">Ink on solid accent</div></div></div>
<div class="sw"><div class="chip" style="background:#58bfa8;display:grid;place-items:center;color:#58bfa8;font:500 13px/1 var(--mono)"></div><div class="m"><div class="n">--accent-dim</div><div class="h">#58bfa8</div><div class="u">Quiet accent glyphs — the + add affordance</div></div></div>
</div></div></body></html>
