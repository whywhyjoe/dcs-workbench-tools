<!-- @dsCard group="Colors" viewport="700x190" subtitle="Every signal has a wash to sit on — never bare red on the panel" name="Signal grounds" -->
<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>body{background:var(--bg-0);padding:16px;font:var(--t-body);color:var(--fg)}
.g{display:grid;gap:10px}.r{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sw{flex:1 1 0;min-width:0;background:var(--bg-1);border:1px solid var(--border);border-radius:var(--radius-m);overflow:hidden}
.sw .chip{height:34px}.sw .m{padding:7px 9px}
.sw .n{font:500 11px/1.3 var(--mono);color:var(--fg-row);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sw .h{font:400 10px/1.3 var(--mono);color:var(--fg-faint);margin-top:2px}
.sw .u{font:400 10.5px/1.4 var(--sans);color:var(--fg-dim);margin-top:5px;text-wrap:pretty}
.lbl{font:var(--t-panel);letter-spacing:var(--ls-panel);text-transform:uppercase;color:var(--fg-faint)}
</style></head><body><div class="r">
<div class="sw"><div class="chip" style="background:#16321f;display:grid;place-items:center;color:#16321f;font:500 13px/1 var(--mono)"></div><div class="m"><div class="n">--ok-soft</div><div class="h">#16321f</div><div class="u">Live-chip ground</div></div></div>
<div class="sw"><div class="chip" style="background:#2a2112;display:grid;place-items:center;color:#2a2112;font:500 13px/1 var(--mono)"></div><div class="m"><div class="n">--warn-soft</div><div class="h">#2a2112</div><div class="u">Notice ground</div></div></div>
<div class="sw"><div class="chip" style="background:#2a1512;display:grid;place-items:center;color:#2a1512;font:500 13px/1 var(--mono)"></div><div class="m"><div class="n">--error-bg</div><div class="h">#2a1512</div><div class="u">Error row wash</div></div></div>
<div class="sw"><div class="chip" style="background:#1c2a38;display:grid;place-items:center;color:#1c2a38;font:500 13px/1 var(--mono)"></div><div class="m"><div class="n">--info-soft</div><div class="h">#1c2a38</div><div class="u">Info notice ground</div></div></div>
</div></body></html>
