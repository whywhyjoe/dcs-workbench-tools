<!-- @dsCard group="Colors" viewport="700x190" subtitle="The soft trio does everything the rationed fill cannot" name="Accent · soft" -->
<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>body{background:var(--bg-0);padding:16px;font:var(--t-body);color:var(--fg)}
.g{display:grid;gap:10px}.r{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sw{flex:1 1 0;min-width:0;background:var(--bg-1);border:1px solid var(--border);border-radius:var(--radius-m);overflow:hidden}
.sw .chip{height:34px}.sw .m{padding:7px 9px}
.sw .n{font:500 11px/1.3 var(--mono);color:var(--fg-row);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sw .h{font:400 10px/1.3 var(--mono);color:var(--fg-faint);margin-top:2px}
.sw .u{font:400 10.5px/1.4 var(--sans);color:var(--fg-dim);margin-top:5px;text-wrap:pretty}
.lbl{font:var(--t-panel);letter-spacing:var(--ls-panel);text-transform:uppercase;color:var(--fg-faint)}
</style></head><body><div class="r">
<div class="sw"><div class="chip" style="background:#1e3b35;display:grid;place-items:center;color:#1e3b35;font:500 13px/1 var(--mono)"></div><div class="m"><div class="n">--accent-soft</div><div class="h">#1e3b35</div><div class="u">Selected-row wash, soft button ground</div></div></div>
<div class="sw"><div class="chip" style="background:#35695c;display:grid;place-items:center;color:#35695c;font:500 13px/1 var(--mono)"></div><div class="m"><div class="n">--accent-soft-line</div><div class="h">#35695c</div><div class="u">Border of soft accent surfaces</div></div></div>
<div class="sw"><div class="chip" style="background:#79e0c6;display:grid;place-items:center;color:#79e0c6;font:500 13px/1 var(--mono)"></div><div class="m"><div class="n">--accent-soft-fg</div><div class="h">#79e0c6</div><div class="u">Text and glyphs on soft accent</div></div></div>
<div class="sw"><div class="chip" style="background:#182b28;display:grid;place-items:center;color:#182b28;font:500 13px/1 var(--mono)"></div><div class="m"><div class="n">--accent-ring</div><div class="h">#182b28</div><div class="u">Focus-ring wash</div></div></div>
</div></body></html>
