<!-- @dsCard group="Motion" viewport="700x150" subtitle="Motion in a developer tool is feedback, not personality" name="Non-negotiable" -->
<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>body{background:var(--bg-0);padding:16px;font:var(--t-body);color:var(--fg)}
.g{display:grid;gap:10px}.r{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.note{font:10.5px/1.5 var(--sans);color:var(--fg-faint);text-wrap:pretty}
.lbl{font:var(--t-panel);letter-spacing:var(--ls-panel);text-transform:uppercase;color:var(--fg-faint)}
.cl{font:500 10.5px/1 var(--mono);color:var(--fg-faint)}
.col{display:flex;flex-direction:column;gap:8px}
</style></head><body><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px 20px">
<div style="display:flex;gap:10px"><span style="flex:none;color:var(--error-fg);font-weight:700">✕</span><span style="font:12.5px/1.5 var(--sans);color:var(--fg-row)">No entrance animation on page load beyond the splash.</span></div><div style="display:flex;gap:10px"><span style="flex:none;color:var(--error-fg);font-weight:700">✕</span><span style="font:12.5px/1.5 var(--sans);color:var(--fg-row)">No animation that loops when nothing is pending.</span></div><div style="display:flex;gap:10px"><span style="flex:none;color:var(--error-fg);font-weight:700">✕</span><span style="font:12.5px/1.5 var(--sans);color:var(--fg-row)">No layout-shifting hover. Hover changes colour, never size.</span></div><div style="display:flex;gap:10px"><span style="flex:none;color:var(--ok);font-weight:700">✓</span><span style="font:12.5px/1.5 var(--sans);color:var(--fg-row)">Every tool ships the <code style="color:var(--accent-soft-fg)">prefers-reduced-motion</code> kill switch.</span></div>
</div></body></html>
