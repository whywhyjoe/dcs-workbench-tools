<!-- @dsCard group="Spacing" viewport="700x170" subtitle="Three radii, and they are assigned — not chosen by eye" name="Radius" -->
<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>body{background:var(--bg-0);padding:16px;font:var(--t-body);color:var(--fg)}
.g{display:grid;gap:10px}.r{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.spec{flex:none;width:112px;font:500 10.5px/1.4 var(--mono);color:var(--fg-faint)}
.note{font:10.5px/1.5 var(--sans);color:var(--fg-faint);text-wrap:pretty}
.lbl{font:var(--t-panel);letter-spacing:var(--ls-panel);text-transform:uppercase;color:var(--fg-faint)}
</style></head><body><div class="g">
<div class="r" style="gap:12px"><i style="width:40px;height:24px;background:var(--bg-3);border:1px solid var(--border-strong);border-radius:var(--radius-s);display:block"></i><span style="font:12.5px/1 var(--sans);color:var(--fg-row)"><b style="color:var(--accent-soft-fg);font:500 12px/1 var(--mono)">3px</b> — rows, badges, tags</span></div><div class="r" style="gap:12px"><i style="width:40px;height:24px;background:var(--bg-3);border:1px solid var(--border-strong);border-radius:var(--radius-m);display:block"></i><span style="font:12.5px/1 var(--sans);color:var(--fg-row)"><b style="color:var(--accent-soft-fg);font:500 12px/1 var(--mono)">4px</b> — buttons, inputs, cards</span></div><div class="r" style="gap:12px"><i style="width:40px;height:24px;background:var(--bg-3);border:1px solid var(--border-strong);border-radius:var(--radius-l);display:block"></i><span style="font:12.5px/1 var(--sans);color:var(--fg-row)"><b style="color:var(--accent-soft-fg);font:500 12px/1 var(--mono)">6px</b> — the app shell, menus, dialogs</span></div><div class="r" style="gap:12px"><i style="width:40px;height:24px;background:var(--bg-3);border:1px solid var(--border-strong);border-radius:var(--radius-pill);display:block"></i><span style="font:12.5px/1 var(--sans);color:var(--fg-row)"><b style="color:var(--accent-soft-fg);font:500 12px/1 var(--mono)">999px</b> — status chips only</span></div>
</div></body></html>
