<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>body{background:var(--bg-0);padding:16px;font:var(--t-body);color:var(--fg)}

.spec{flex:none;width:112px;font:500 10.5px/1.4 var(--mono);color:var(--fg-faint)}
.note{font:10.5px/1.5 var(--sans);color:var(--fg-faint);text-wrap:pretty}
.lbl{font:var(--t-panel);letter-spacing:var(--ls-panel);text-transform:uppercase;color:var(--fg-faint)}
</style></head><body><div class="g"><div class="r" style="align-items:flex-end;gap:8px">
<div style="display:flex;flex-direction:column;align-items:center;gap:5px"><i style="display:block;background:var(--accent-soft-line);border-top:2px solid var(--accent);width:12px;height:4px"></i><span style="font:10px/1 var(--mono);color:var(--fg-faint)">2</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:5px"><i style="display:block;background:var(--accent-soft-line);border-top:2px solid var(--accent);width:12px;height:8px"></i><span style="font:10px/1 var(--mono);color:var(--fg-faint)">4</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:5px"><i style="display:block;background:var(--accent-soft-line);border-top:2px solid var(--accent);width:12px;height:12px"></i><span style="font:10px/1 var(--mono);color:var(--fg-faint)">6</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:5px"><i style="display:block;background:var(--accent-soft-line);border-top:2px solid var(--accent);width:12px;height:16px"></i><span style="font:10px/1 var(--mono);color:var(--fg-faint)">8</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:5px"><i style="display:block;background:var(--accent-soft-line);border-top:2px solid var(--accent);width:12px;height:20px"></i><span style="font:10px/1 var(--mono);color:var(--fg-faint)">10</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:5px"><i style="display:block;background:var(--accent-soft-line);border-top:2px solid var(--accent);width:12px;height:24px"></i><span style="font:10px/1 var(--mono);color:var(--fg-faint)">12</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:5px"><i style="display:block;background:var(--accent-soft-line);border-top:2px solid var(--accent);width:12px;height:32px"></i><span style="font:10px/1 var(--mono);color:var(--fg-faint)">16</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:5px"><i style="display:block;background:var(--accent-soft-line);border-top:2px solid var(--accent);width:12px;height:40px"></i><span style="font:10px/1 var(--mono);color:var(--fg-faint)">20</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:5px"><i style="display:block;background:var(--accent-soft-line);border-top:2px solid var(--accent);width:12px;height:48px"></i><span style="font:10px/1 var(--mono);color:var(--fg-faint)">24</span></div>
</div><div class="note">Gutters between panes are always <strong style="color:var(--fg-row);font-weight:600">5px</strong> — that is the splitter track, a control, not a spacing step.</div></div></body></html>
