<!-- @dsCard group="Colors" viewport="700x190" subtitle="Four steps, in order — never skip one to create contrast" name="Surfaces" -->
<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>body{background:var(--bg-0);padding:16px;font:var(--t-body);color:var(--fg)}
.g{display:grid;gap:10px}.r{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sw{flex:1 1 0;min-width:0;background:var(--bg-1);border:1px solid var(--border);border-radius:var(--radius-m);overflow:hidden}
.sw .chip{height:34px}.sw .m{padding:7px 9px}
.sw .n{font:500 11px/1.3 var(--mono);color:var(--fg-row);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sw .h{font:400 10px/1.3 var(--mono);color:var(--fg-faint);margin-top:2px}
.sw .u{font:400 10.5px/1.4 var(--sans);color:var(--fg-dim);margin-top:5px;text-wrap:pretty}
.lbl{font:var(--t-panel);letter-spacing:var(--ls-panel);text-transform:uppercase;color:var(--fg-faint)}
</style></head><body><div class="r">
<div class="sw"><div class="chip" style="background:#14161b;display:grid;place-items:center;color:#14161b;font:500 13px/1 var(--mono)"></div><div class="m"><div class="n">--bg-0</div><div class="h">#14161b</div><div class="u">App ground, gutters, splitter tracks, input wells</div></div></div>
<div class="sw"><div class="chip" style="background:#1a1d23;display:grid;place-items:center;color:#1a1d23;font:500 13px/1 var(--mono)"></div><div class="m"><div class="n">--bg-1</div><div class="h">#1a1d23</div><div class="u">Panel bodies, cards, sidebars</div></div></div>
<div class="sw"><div class="chip" style="background:#20242c;display:grid;place-items:center;color:#20242c;font:500 13px/1 var(--mono)"></div><div class="m"><div class="n">--bg-2</div><div class="h">#20242c</div><div class="u">Chrome: topbar, panel heads, tab strips, status bar</div></div></div>
<div class="sw"><div class="chip" style="background:#2a2f3a;display:grid;place-items:center;color:#2a2f3a;font:500 13px/1 var(--mono)"></div><div class="m"><div class="n">--bg-3</div><div class="h">#2a2f3a</div><div class="u">Hover, pressed, filled segment</div></div></div>
</div></body></html>
