<!-- @dsCard group="Components" viewport="700x300" name="Navigation" subtitle="Editor tabs with a count pill, underline tabs, mono breadcrumbs, grouped rail" -->
<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:14px;background:var(--bg-0);color:var(--fg);font:var(--t-body)}
.rw{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end}
.cl{font:500 10.5px/1 var(--mono);color:var(--fg-faint)}
.col{display:flex;flex-direction:column;gap:8px;min-width:0}
.gr{display:grid;gap:12px}</style></head><body><div id="root"></div>
<script type="text/babel">
const { Tabs, Crumbs, Rail, RailLabel, RailItem, Icon } = window.DCSWorkbenchDesignSystem_dafd54;

function Card() {
  const [t, setT] = React.useState('html');
  const [u, setU] = React.useState('Fields');
  return (
    <div style={{display:'grid',gridTemplateColumns:'1fr 190px',gap:20,alignItems:'start'}}>
      <div className="gr">
        <div className="col"><span className="cl">.dcs-tabs — the active tab drops to the surface it opens</span>
          <div>
            <Tabs tabs={[{value:'html',label:'HTML'},{value:'css',label:'CSS'},{value:'console',label:'Console',count:3}]} value={t} onChange={setT} />
            <div style={{height:34,background:'var(--bg-editor)',borderRadius:'0 0 4px 4px'}} />
          </div>
        </div>
        <div className="col"><span className="cl">.dcs-tabs-underline — tabs inside a view</span>
          <Tabs underline tabs={['Fields','Items','Raw']} value={u} onChange={setU} />
        </div>
        <div className="col"><span className="cl">.dcs-crumbs — always mono, last segment is not a button</span>
          <Crumbs items={['/sites/NewNerve','Documents','Splash']} />
        </div>
      </div>
      <Rail style={{border:'1px solid var(--border)',borderRadius:4}}>
        <RailLabel>Site</RailLabel>
        <RailItem glyph={<Icon name="globe" />}>Overview</RailItem>
        <RailLabel>Content</RailLabel>
        <RailItem glyph={<Icon name="list" />}>Lists</RailItem>
        <RailItem glyph={<Icon name="folder" />} active>Files</RailItem>
        <RailLabel>Tools</RailLabel>
        <RailItem glyph={<Icon name="code" />}>Console</RailItem>
      </Rail>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Card />);
</script></body></html>
