<!-- @dsCard group="Components" viewport="700x300" name="Overlay" subtitle="Menu, dialog and the one-phrase tip — the only three floating surfaces" -->
<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:14px;background:var(--bg-0);color:var(--fg);font:var(--t-body)}
.rw{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end}
.cl{font:500 10.5px/1 var(--mono);color:var(--fg-faint)}
.col{display:flex;flex-direction:column;gap:8px;min-width:0}
.gr{display:grid;gap:12px}</style></head><body><div id="root"></div>
<script type="text/babel">
const { Menu, MenuLabel, MenuItem, MenuSep, Badge, Button, IconButton, TipHost, Field, Input, Icon } = window.DCSWorkbenchDesignSystem_dafd54;

function Card() {
  return (
    <div style={{display:'grid',gridTemplateColumns:'260px 1fr',gap:24,alignItems:'start'}}>
      <div className="col"><span className="cl">menu</span>
        <Menu style={{position:'static'}}>
          <MenuLabel>Export</MenuLabel>
          <MenuItem lead={<Badge type="html" />}>Export HTML</MenuItem>
          <MenuItem lead={<Badge type="js" />} active>Export JS</MenuItem>
          <MenuSep />
          <MenuItem lead={<Badge>sp</Badge>} disabled>Export to SharePoint…</MenuItem>
        </Menu>
      </div>
      <div className="col"><span className="cl">dialog · tip</span>
        <div className="dcs-dialog" style={{width:340,margin:0}}>
          <div className="dcs-dialog-panel">
            <div className="dcs-dialog-head">
              <h2>Save snippet</h2>
              <IconButton size="sm" title="Close"><Icon name="close" size={13} /></IconButton>
            </div>
            <p className="dcs-dialog-context">Saving the current JS selection — 14 lines.</p>
            <Field label="Snippet name"><Input mono /></Field>
            <div className="dcs-dialog-actions">
              <Button variant="ghost">Cancel</Button>
              <Button variant="primary" size="lg">Save snippet</Button>
            </div>
          </div>
        </div>
        <TipHost tip="Maximise pane" below><IconButton size="sm" title="Maximise pane"><Icon name="maximize" size={13} /></IconButton></TipHost>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Card />);
</script></body></html>
