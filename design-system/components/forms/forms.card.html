<!-- @dsCard group="Components" viewport="700x330" name="Forms" subtitle="Fields, mono inputs, invalid, select, toggle, slider, swatches, resize rail" -->
<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:14px;background:var(--bg-0);color:var(--fg);font:var(--t-body)}
.rw{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end}
.cl{font:500 10.5px/1 var(--mono);color:var(--fg-faint)}
.col{display:flex;flex-direction:column;gap:8px;min-width:0}
.gr{display:grid;gap:12px}</style></head><body><div id="root"></div>
<script type="text/babel">
const { Field, Input, Textarea, Select, Toggle, Check, Slider, Swatches, ResizeRail } = window.DCSWorkbenchDesignSystem_dafd54;

function Card() {
  const [w, setW] = React.useState(9);
  const [c, setC] = React.useState('#3fd8b4');
  const [on, setOn] = React.useState(true);
  return (
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'18px 24px'}}>
      <Field label="Text input"><Input defaultValue="Meet the Insights team" /></Field>
      <Field label="Mono input — paths, URLs, endpoints" hint="Focus: --accent-soft-line border + 2px --accent-ring.">
        <Input mono defaultValue="/sites/NewNerve/FCUPortal/Code" />
      </Field>
      <Field label="Select"><Select options={['Documents','Site Pages','Announcements']} /></Field>
      <Field label="Invalid" invalid hint="Enter an absolute https:// URL on this tenant."><Input invalid defaultValue="not a url" /></Field>
      <Field label="Stroke weight" value={w + ' px'}><Slider min={1} max={40} value={w} onChange={e => setW(+e.target.value)} /></Field>
      <Field label="Disabled"><Input disabled defaultValue="DocVersion" /></Field>
      <div className="col"><span className="cl">toggle · check</span>
        <div className="rw" style={{gap:20,alignItems:'center'}}>
          <Toggle label="Auto-run" checked={on} onChange={e => setOn(e.target.checked)} />
          <Toggle label="Run as module" checked={false} onChange={() => {}} />
          <Check label="Clear console on run" defaultChecked />
        </div>
      </div>
      <div className="col"><span className="cl">swatches · resize rail</span>
        <div className="rw" style={{gap:20,alignItems:'center'}}>
          <Swatches colors={['#3fd8b4','#67a7f7','#e8b660','#f2f5fa']} value={c} onChange={setC} />
          <span style={{display:'flex',alignItems:'stretch',height:44}}>
            <ResizeRail tip="" />
            <span style={{width:120,border:'1px solid var(--border)',borderLeft:0,borderRadius:'0 4px 4px 0',backgroundColor:'var(--bg-0)',backgroundImage:'linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px)',backgroundSize:'24px 24px,24px 24px'}} />
          </span>
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Card />);
</script></body></html>
