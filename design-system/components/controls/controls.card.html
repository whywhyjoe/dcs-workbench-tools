<!-- @dsCard group="Components" viewport="700x230" name="Controls" subtitle="Buttons in four tiers, segmented control, the welded xs microbar" -->
<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:14px;background:var(--bg-0);color:var(--fg);font:var(--t-body)}
.rw{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end}
.cl{font:500 10.5px/1 var(--mono);color:var(--fg-faint)}
.col{display:flex;flex-direction:column;gap:8px;min-width:0}
.gr{display:grid;gap:12px}</style></head><body><div id="root"></div>
<script type="text/babel">
const { Button, IconButton, Segmented, Microbar, MicrobarValue, Icon, PlayGlyph } = window.DCSWorkbenchDesignSystem_dafd54;

function Card() {
  const [v, setV] = React.useState('Tree');
  return (
    <div className="gr">
      <div className="rw">
        <div className="col"><span className="cl">primary · lg</span><Button variant="primary" size="lg" kbd="⌘↵"><PlayGlyph />Run</Button></div>
        <div className="col"><span className="cl">soft</span><Button variant="soft">Add framework</Button></div>
        <div className="col"><span className="cl">default</span><Button>Inspect</Button></div>
        <div className="col"><span className="cl">ghost</span><Button variant="ghost">Cancel</Button></div>
        <div className="col"><span className="cl">sm</span><Button size="sm">Export</Button></div>
        <div className="col"><span className="cl">:disabled</span><Button disabled>Review metadata</Button></div>
        <div className="col"><span className="cl">icon · sm</span><span style={{display:'flex',gap:2}}>
          <IconButton size="sm" title="Refresh"><Icon name="refresh" size={13} /></IconButton>
          <IconButton size="sm" title="Maximise"><Icon name="maximize" size={13} /></IconButton>
          <IconButton size="sm" variant="danger" title="Delete"><Icon name="trash" size={13} /></IconButton>
        </span></div>
      </div>
      <div className="rw" style={{alignItems:'flex-end'}}>
        <div className="col"><span className="cl">segmented</span><Segmented options={['Tree','Table','Raw']} value={v} onChange={setV} /></div>
        <div className="col" style={{flex:'1 1 300px'}}><span className="cl">microbar — xs, welded, glyph-only, every child titled</span>
          <Microbar>
            <button title="Back"><Icon name="arrow-left" size={12} /></button>
            <MicrobarValue>https://nervedotnet.sharepoin</MicrobarValue>
            <button title="Reload"><Icon name="refresh" size={12} /></button>
            <button title="Open folder"><Icon name="folder" size={13} /></button>
            <button title="Go"><Icon name="arrow-right" size={12} /></button>
          </Microbar>
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Card />);
</script></body></html>
